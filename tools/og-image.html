<!doctype html>
<!--
  Source of website-src/og-image.png (the Open Graph / Twitter preview, 1200x630).
  Regenerate with Edge or Chrome:
    msedge --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=website-src/og-image.png file:///<repo>/tools/og-image.html
  System fonts only, so it renders the same without network access.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MikroTik MCP social preview</title>
<style>
  :root { --bg:#0a0d12; --bg-2:#141921; --line:#313a48; --ink:#ece6d8; --dim:#a9b1bd; --mute:#6b7380; --amber:#ff8a3d; --lime:#b6f25c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  body { position: relative; padding: 64px 72px; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px; opacity: .16;
    -webkit-mask-image: radial-gradient(ellipse at 70% 40%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse at 70% 40%, #000 20%, transparent 75%); }
  .glow { position: absolute; right: -160px; top: -200px; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,138,61,.22), transparent 65%); }
  .brand { position: relative; display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 600; letter-spacing: .01em; }
  .brand svg { width: 44px; height: 44px; }
  h1 { position: relative; margin-top: 74px; font-size: 76px; line-height: 1.05; font-weight: 600; letter-spacing: -.02em; max-width: 980px; }
  h1 em { font-style: normal; color: var(--amber); }
  .sub { position: relative; margin-top: 26px; font-size: 30px; line-height: 1.35; color: var(--dim); max-width: 900px; }
  .chips { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 14px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 22px; }
  .chips span { padding: 9px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-2); color: var(--ink); }
  .chips span b { color: var(--lime); font-weight: 500; }
  .url { position: absolute; right: 72px; bottom: 70px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 22px; color: var(--mute); }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="2.5" y="9" width="19" height="8.5" rx="1" stroke="#ff8a3d"/>
      <line x1="6" y1="13.25" x2="9" y2="13.25" stroke="#b6f25c"/>
      <line x1="11" y1="13.25" x2="14" y2="13.25" stroke="#b6f25c"/>
      <line x1="16" y1="13.25" x2="18" y2="13.25" stroke="#b6f25c"/>
      <line x1="7" y1="9" x2="5" y2="4" stroke="#ff8a3d"/>
      <line x1="12" y1="9" x2="12" y2="3" stroke="#ff8a3d"/>
      <line x1="17" y1="9" x2="19" y2="4" stroke="#ff8a3d"/>
      <circle cx="5" cy="4" r="0.9" fill="#ff8a3d" stroke="none"/>
      <circle cx="12" cy="3" r="0.9" fill="#ff8a3d" stroke="none"/>
      <circle cx="19" cy="4" r="0.9" fill="#ff8a3d" stroke="none"/>
    </svg>
    MikroTik MCP
  </div>
  <h1>Talk to your <em>RouterOS</em> routers in plain English</h1>
  <p class="sub">An open-source MCP server for MikroTik, plus a language server and agent skills for RouterOS.</p>
  <div class="chips"><span><b>mcp</b> server</span><span><b>routeros</b>-lsp</span><span><b>routeros</b>-skills</span></div>
  <div class="url">mikrotik-mcp.com</div>
</body>
</html>
