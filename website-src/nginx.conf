server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Build redirects from the path only. The site sits behind a TLS-terminating proxy, so an
    # absolute Location would be built from the plain-HTTP request and send visitors (and
    # crawlers) from https:// back to http:// (for example /docs to http://host/docs/).
    absolute_redirect off;

    # Compress text assets on the fly.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_types      text/plain text/css text/xml application/xml application/javascript image/svg+xml;

    # Security headers.
    add_header X-Content-Type-Options "nosniff"                 always;
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # One URL per page: the directory index is reached as / and /docs/, never as .../index.html.
    # $request_uri is the URL the client asked for, so the internal redirect that `index`
    # performs for / and /docs/ does not trigger these.
    if ($request_uri ~ ^/index\.html(\?.*)?$)      { return 301 /; }
    if ($request_uri ~ ^/docs/index\.html(\?.*)?$) { return 301 /docs/; }

    # A real 404 page (it carries noindex). The status stays 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Long cache for fingerprint-free static assets.
    location ~* \.(?:css|js|svg|jpe?g|png|gif|ico|woff2?)$ {
        expires    7d;
        add_header Cache-Control "public";
        # add_header in a location replaces the server-level ones, so repeat them here.
        add_header X-Content-Type-Options "nosniff"                 always;
        add_header X-Frame-Options        "SAMEORIGIN"              always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files  $uri =404;
    }

    # Serve HTML pages; fall back to a 404 for unknown paths.
    location / {
        try_files $uri $uri/ =404;
    }
}
